name: Interactive Telegram Anime Bot

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Manual command test'
        required: false
        default: '/update'
  schedule:
    - cron: '0 * * * *' # Wakes up at the top of every hour

jobs:
  listen-and-reply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 40-Minute Command Listener
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOT_COMMAND: ${{ github.event.inputs.command }}
        run: python bot.py
