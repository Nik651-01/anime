name: Interactive Telegram Anime Bot

on:
  workflow_dispatch: # Manual start button
  schedule:
    # Keeps a background listener window open without sending any automatic messages
    - cron: '0 */3 * * *'

concurrency:
  group: telegram-bot-listener
  cancel-in-progress: true

jobs:
  listen-and-reply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Interactive Bot Listener
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py
